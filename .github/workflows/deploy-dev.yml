name: Deploy to Develop

concurrency: "1"

on:
  workflow_dispatch:

  push:
    branches:
      - dev
    paths:
      - "**/*.yml"
      - "**/*.py"
      - "**/*.ipynb"

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_BUNDLE_ENV: ${{ vars.ENVIRONMENT_NAME }}
      DATABRICKS_AUTH_TYPE: "oauth-m2m"
      BUNDLE_VAR_repository: https://github.com/${{ github.repository }}
      BUNDLE_VAR_git_ref_name: https://github.com/${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@main

      - run: databricks bundle validate
       
      - run: databricks bundle deploy 
       

  pipeline_update:
    name: "Run pipeline update"
    runs-on: ubuntu-latest

    needs:
      - deploy

    steps:
      - uses: actions/checkout@v3

      - uses: databricks/setup-cli@dev

      - shell: bash
        name: Run pipeline update
        run: |
          set -o pipefail

          keys=("databricks_dab_test_serverless_job" "databricks_dab_test_serverless_pipeline")

          for key in "${keys[@]}"; do
            echo "Running: $key"
            databricks bundle run "$key" --refresh-all 2>&1 | tee "output_${key}.log"
          done